info:
  scm-url: "@scm.url@"
  build-url: "https://travis-ci.org/codecentric/spring-boot-admin"

logging:
  file:
    name: "target/boot-admin-sample-reactive.log"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: ALWAYS

spring:
  http:
    converters:
      preferred-json-mapper: jackson2
    codecs:
      preferred-json-mapper: jackson2
  application:
    name: spring-boot-admin-sample-reactive
  boot:
    admin:
      client:
        url: http://localhost:8080
  profiles:
    active:
      - insecure
