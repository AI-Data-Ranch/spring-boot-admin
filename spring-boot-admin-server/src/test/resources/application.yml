server:
  port: 8080
  shutdown: immediate
spring:
    application:
        name: spring-boot-admin-server-test
    jmx:
        enabled: false
    mvc:
      pathmatch:
        matching-strategy: ant_path_matcher
    http:
      converters:
        preferred-json-mapper: jackson2
      codecs:
        preferred-json-mapper: jackson2
management:
  info:
    env:
      enabled: true
logging:
  level:
    de.codecentric: DEBUG
